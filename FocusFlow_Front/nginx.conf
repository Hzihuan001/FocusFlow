server {
    listen 80;
    server_name localhost;

    # 1. 托管 Vue 3 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 这一行非常重要，防止 Vue Router 在刷新页面时报 404 错误
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理：将 /api/ 打头的请求转发给后端的 Spring Boot 容器
    location /api/ {
        # 这里的 focus-server 是 docker-compose.yml 中定义的后端服务名
        proxy_pass http://focus-server:8080/api/;
        
        # 传递客户端真实 IP 与信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 【核心配置】针对 FocusFlow 中 AI 大模型 SSE 流式对话的专属优化
        # 关闭缓存和缓冲，确保 AI 打字机效果实时逐字显示，不卡顿
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        # 防止长连接由于 AI 思考时间过长而超时中断
        proxy_read_timeout 86400s;
    }
}