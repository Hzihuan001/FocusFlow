version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: focus-mysql
    restart: always
    # 🌟 核心防卡死 1：禁止 MySQL 进行反向 DNS 解析
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: focus_flow
      TZ: Asia/Shanghai
    volumes:
      - focus-mysql-data:/var/lib/mysql
      - ./DOC/sql/FocusFlow_Full_Init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - focus-net
    deploy:
      resources:
        limits:
          memory: 800M

  focus-server:
    build: 
      context: ./FocusFlow_Server
    container_name: focus-backend
    restart: always
    depends_on:
      - mysql-db
    environment:
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - TZ=Asia/Shanghai
    # 🌟 核心防卡死 2 + X光透视：非阻塞随机数 + 强制DB参数 + DEBUG级日志
    entrypoint: >
      java -Djava.security.egd=file:/dev/./urandom -Xms512m -Xmx512m -XX:+UseG1GC -jar app.jar 
      --spring.datasource.url="jdbc:mysql://mysql-db:3306/focus_flow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      --spring.datasource.username=root
      --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - focus-uploads:/app/uploads
    networks:
      - focus-net

  focus-web:
    build:
      context: ./FocusFlow_Front
      dockerfile: Dockerfile 
    container_name: focus-frontend
    restart: always
    depends_on:
      - focus-server
    ports:
      - "3000:80" 
    networks:
      - focus-net

volumes:
  focus-mysql-data:
  focus-uploads:

networks:
  focus-net:
    driver: bridge