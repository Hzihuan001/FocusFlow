# ═══════════════════════════════════════════════════════════════════════════════
# FocusFlow Server 配置文件 (Cloud Docker Optimized)
# ═══════════════════════════════════════════════════════════════════════════════

server:
  port: 8080
  servlet:
    context-path: /api
  # HTTPS 配置（生产环境建议在 Nginx 层处理 SSL，此处默认关闭）
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:focusflow}

spring:
  application:
    name: focusflow-server

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ═══════════════════════════════════════════════════════════════════════════
  # 数据源配置（针对 MySQL 8.0 容器环境进行了优化）
  # ═══════════════════════════════════════════════════════════════════════════
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 增加了 useSSL=false 和 allowPublicKeyRetrieval=true 以解决连接挂起问题
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:focus_flow}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    
    # HikariCP 连接池优化
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: FocusFlowHikariPool
      max-lifetime: 1800000
      # 适当增加连接超时时间，给 MySQL 初始化留出空间
      connection-timeout: 60000 
      # 启动时检查连接有效性
      connection-test-query: SELECT 1

  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ═══════════════════════════════════════════════════════════════════════════════
# 文件上传目录配置 (Docker 挂载目录同步)
# ═══════════════════════════════════════════════════════════════════════════════
file:
  # 这里的默认值改为 Docker 内部路径
  upload-dir: ${UPLOAD_DIR:/app/uploads}

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.focusflow.server.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境如果日志太多可以改为 info，目前保留以方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0