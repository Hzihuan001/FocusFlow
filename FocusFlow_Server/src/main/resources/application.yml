# ═══════════════════════════════════════════════════════════════════════════════
# FocusFlow Server 配置文件
# ═══════════════════════════════════════════════════════════════════════════════

server:
  port: 8080
  servlet:
    context-path: /api
  # ═══════════════════════════════════════════════════════════════════════════
  # HTTPS 配置（生产环境必须启用）
  # ═══════════════════════════════════════════════════════════════════════════
  # 启用方式：设置环境变量 SSL_ENABLED=true
  # 证书配置：设置 SSL_KEY_STORE 和 SSL_KEY_STORE_PASSWORD
  # 
  # 开发环境生成自签名证书：
  # keytool -genkeypair -alias focusflow -keyalg RSA -keysize 2048 \
  #   -storetype PKCS12 -keystore keystore.p12 -validity 365 \
  #   -storepass your_password
  # ═══════════════════════════════════════════════════════════════════════════
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:focusflow}

spring:
  application:
    name: focusflow-server

  # ═══════════════════════════════════════════════════════════════════════════
  # 文件上传配置
  # ═══════════════════════════════════════════════════════════════════════════
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ═══════════════════════════════════════════════════════════════════════════
  # 数据源配置（敏感信息使用环境变量，开发环境有默认值）
  # ═══════════════════════════════════════════════════════════════════════════
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:focus_flow}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: FocusFlowHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000

  # ═══════════════════════════════════════════════════════════════════════════
  # JSON 序列化配置
  # ═══════════════════════════════════════════════════════════════════════════
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ═══════════════════════════════════════════════════════════════════════════════
# 文件上传目录配置
# ═══════════════════════════════════════════════════════════════════════════════
# 开发环境：使用相对路径 uploads/
# 生产环境：使用绝对路径 /var/www/focusflow/uploads
# 可通过环境变量 UPLOAD_DIR 覆盖
file:
  upload-dir: ${UPLOAD_DIR:/var/www/focusflow/uploads}

# ═══════════════════════════════════════════════════════════════════════════════
# MyBatis-Plus 配置
# ═══════════════════════════════════════════════════════════════════════════════
mybatis-plus:
  # 实体类扫描路径
  type-aliases-package: com.focusflow.server.entity
  # Mapper XML 文件路径（如有）
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启 SQL 日志（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ═══════════════════════════════════════════════════════════════════════════════
# 日志配置（由 logback-spring.xml 接管）
# 日志目录：/opt/focusflow/logs（可通过环境变量 LOG_PATH 覆盖）
# ═══════════════════════════════════════════════════════════════════════════════
